const ban=(k,pos)=>`<img class="ban" src="${IMG[k]}" alt="" style="object-position:${pos}">`;
const QUOTES=["خطوة ورا خطوة.. وهتوصل إن شاء الله 💪","نصف ساعة تركيز أحسن من ساعتين تشتيت 🎯","مش لازم تكون مثالي، مهم تبدأ ✨","تعب النهارده هو فرحتك بكره 🎉","أنت أقرب مما تتخيل 🚀","كل مهمة تخلصها بتقرّبك من حلمك 🌟","نظّم وقتك وهتلاقي الدنيا أهدى 💜"];
function streak(){let n=0,d=new Date();const k=()=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(!S.pomo[k()])d.setDate(d.getDate()-1);while(S.pomo[k()]>0){n++;d.setDate(d.getDate()-1)}return n}
function burst(){for(let i=0;i<22;i++){const e=document.createElement("i");e.className="cf";e.textContent=["🎉","✨","📚","⭐","💜"][i%5];e.style.cssText=`left:${50+(Math.random()-.5)*30}vw;--x:${(Math.random()-.5)*70}vw;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.2}s`;document.body.append(e);setTimeout(()=>e.remove(),2000)}}
function shrink(f,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),"image/jpeg",q)};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u})}
const rd=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
function adj(d){const t=MODES[T.mode][1],n=Math.min(10800,Math.max(60,t+d*60)),df=n-t;MODES[T.mode][1]=n;if(T.run){T.left=Math.max(1,T.left+df);T.end+=df*1000}else T.left=n;if(T.mode==="focus")S.focus=n/60;else S[T.mode]=n/60;save();tick()}
const sorted=()=>[...S.tasks].sort((a,b)=>(a.done-b.done)||((a.due||"9")>(b.due||"9")?1:-1));
const due=t=>t.due?`<small class="due ${!t.done&&t.due<dayKey()?"late":""}">📅 ${esc(t.due)}</small>`:"";
const exs=()=>[...S.exams].sort((a,b)=>(a.date+(a.time||"00:00")).localeCompare(b.date+(b.time||"00:00")));
const dleft=e=>Math.round((new Date(e.date+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
const fmtD=d=>{try{return new Date(d+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch{return d}};
const fmtT=t=>{try{return new Date("1970-01-01T"+t).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"})}catch{return t}};
const exMeta=e=>[`📅 ${esc(fmtD(e.date))}`,e.time?`🕐 ${esc(fmtT(e.time))}`:"",e.place?`📍 ${esc(e.place)}`:""].filter(Boolean).join(" · ");
function exam(){const up=exs().filter(e=>dleft(e)>=0);
  if(!up.length)return `<button class="card click exam" data-a="go" data-v="exams"><span class="emo">⏳</span>${S.exams.length?"مفيش امتحانات قادمة. ":""}أضف مواعيد امتحاناتك لعدّاد تنازلي</button>`;
  return up.slice(0,3).map(e=>{const d=dleft(e);return `<button class="card click exam" data-a="go" data-v="exams"><span class="emo">${d===0?"🍀":"⏳"}</span><div><div>${d===0?"النهاردة امتحان ":d===1?"بكرة امتحان ":"باقي "+d+" يوم على امتحان "}${esc(e.subject)}</div><small style="display:block;color:var(--mu);font-weight:400">${exMeta(e)}</small></div></button>`}).join("")}
function goal(){const n=S.pomo[dayKey()]||0,g=S.goal||4;return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>🎯 هدف اليوم</b><small>${n}/${g} جلسات</small></div><div class="bar"><i style="width:${Math.min(100,n/g*100)}%"></i></div></div>`}
/* views */
const V={};
V.home=()=>{
  const h=new Date().getHours(),g=h<12?"صباح الخير":h<18?"نهار سعيد":"مساء الخير";
  const files=S.books.reduce((n,b)=>n+Object.values(b.items||{}).flat().filter(i=>i&&i.fileId).length,0);
  const open=sorted().filter(t=>!t.done),tp=S.tasks.length?Math.round((S.tasks.length-open.length)/S.tasks.length*100):0,bs=S.books.filter(b=>b.chapters&&b.chapters.total),ov=bs.length?Math.round(bs.reduce((x,b)=>x+pct(b),0)/bs.length):tp;
  return `<section class="card hero" style="background-image:linear-gradient(130deg,rgba(60,20,130,.88),rgba(147,51,234,.6)),url(${S.cover||IMG.h});background-size:cover;background-position:center"><button class="av" data-a="pickPh" aria-label="صورتي">${avInner()}</button><input type="file" id="phf" accept="image/*" hidden><div><h2>${g} يا ${esc(S.user.name)} 👋</h2><p>${QUOTES[new Date().getDate()%QUOTES.length]}</p><div class="big" id="hc"></div></div></section>
  ${annBox()}${exam()}${goal()}<div class="g2">
   <div class="card stat2"><span>مهام النهاردة</span><b>${S.tasks.length-open.length}/${S.tasks.length}</b><div class="bar"><i style="width:${tp}%"></i></div></div>
   <div class="card stat2"><span>وقت التركيز</span><b>${String(S.focus||25).padStart(2,"0")}:00</b><small>${S.pomo[dayKey()]||0} جلسة النهاردة</small></div>
   <div class="card stat2"><span>الإنجاز</span><div class="ring" style="--v:${ov}"><b>${ov}%</b></div></div>
   <div class="card stat2"><span>المواد</span><b>${S.books.length}</b><small>${files} ملف · 🔥 ${streak()}</small></div></div>
  <button class="btn" data-a="go" data-v="timer" style="width:100%;margin:4px 0 6px">ابدأ يومك ▶</button>
  <div class="sec"><h2>مهام قادمة</h2></div>
  <div class="list">${open.slice(0,4).map(t=>`<div class="it"><span class="t">${esc(t.text)}${due(t)}</span></div>`).join("")||`<div class="empty">مفيش مهام مفتوحة 🎉</div>`}</div>`};
function grid(){const q=(sub.q||"").trim().toLowerCase();
  const l=S.books.filter(b=>!q||b.title.toLowerCase().includes(q));
  return l.length?l.map(b=>`<button class="card click bk" data-a="book" data-v="${esc(b.id)}"><div class="bki">${esc(b.emoji||"📘")}</div><div class="bkt"><h3>${esc(b.title)}</h3><p>${b.chapters&&b.chapters.total?"الفصول: "+b.chapters.done+"/"+b.chapters.total+" · ":""}${cnt(b)} عنصر</p></div><div class="ring sm" style="--v:${pct(b)}"><b>${pct(b)}%</b></div><span class="mu">‹</span></button>`).join(""):`<div class="empty">${S.books.length?"مفيش نتائج للبحث.":"لسه مفيش كتب. اضغط «إضافة عنوان» للبدء 📚"}</div>`}
V.library=()=>{
  const b=book(),cat=CATS.find(c=>c[0]===sub.c);
  if(!b)return `${ban("l","50% 30%")}<div class="sec"><input id="q" type="search" placeholder="🔍 ابحث في كتبك" value="${esc(sub.q||"")}" style="max-width:340px"><button class="btn" data-a="addBook">＋ إضافة عنوان</button></div><div class="grid" id="books">${grid()}</div>`;
  if(!cat)return `<div class="sec"><button class="btn g sm" data-a="back">→ رجوع للكتب</button><button class="btn d sm" data-a="delBook">حذف العنوان</button></div>${prog(b)}
   <div class="grid" id="books">${CATS.map(c=>`<button class="card click bk" data-a="cat" data-v="${c[0]}"><div class="bki">${c[2]}</div><div class="bkt"><h3>${c[1]}</h3><p>${items(b,c[0]).length} عنصر</p></div><span class="mu">‹</span></button>`).join("")}</div>`;
  const l=items(b,cat[0]);
  if(!sub.i)return `<div class="sec"><button class="btn g sm" data-a="back">→ رجوع للأقسام</button><span class="row">${cat[0]==="cards"&&l.length?`<button class="btn s" data-a="flash">🃏 ابدأ المراجعة</button>`:""}<button class="btn" data-a="addItem">＋ إضافة محتوى</button></span></div>
   <div class="list">${l.map(i=>`<div class="it fl"><div class="fi ${/\.pdf$/i.test(i.fileName||"")?"p":/\.(png|jpe?g|gif|webp)$/i.test(i.fileName||"")?"i":""}">${/\.pdf$/i.test(i.fileName||"")?"PDF":/\.(png|jpe?g|gif|webp)$/i.test(i.fileName||"")?"IMG":i.fileId?"FILE":"TXT"}</div><div><b>${esc(i.title)}</b><p>${esc(i.fileName||i.text||"")}</p>${i.pos&&i.pos.p>1?`<span class="pc">📍 صفحة ${i.pos.p}</span>`:i.pos&&i.pos.y>0?`<span class="pc">📍 تم حفظ مكانك</span>`:""}</div><div class="row"><button class="btn s sm" data-a="item" data-v="${esc(i.id)}">فتح</button><button class="btn d sm" data-a="delItem" data-v="${esc(i.id)}">حذف</button></div></div>`).join("")||`<div class="empty">مفيش محتوى هنا. أضف ملف PDF أو صورة أو نص.</div>`}</div>`;

 flash:()=>{const l=items(book(),sub.c);if(!l.length)return;const c=l[Math.floor(Math.random()*l.length)];dlg().innerHTML=`<h2 style="margin:0 0 12px;font-size:19px">${esc(c.title)}</h2><div id="fa" class="rt" hidden style="padding:12px;border-radius:12px;background:var(--sf2)">${esc(c.text||"مفيش إجابة مكتوبة")}</div><div class="row" style="margin-top:16px"><button class="btn" data-a="fshow">إظهار الإجابة</button><button class="btn s" data-a="flash">التالي ←</button><button class="btn g" data-a="close">إغلاق</button></div>`;if(!dlg().open)dlg().showModal()},fshow:()=>{$("#fa").hidden=false},addExam:()=>exForm(),editExam:v=>exForm(S.exams.find(x=>x.id===v)),delExam:v=>{const e=S.exams.find(x=>x.id===v);if(!e||!confirm("حذف امتحان "+e.subject+"؟"))return;S.exams=S.exams.filter(x=>x.id!==v);save();render()},
 theme2:()=>{const dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);S.theme=dark?"light":"dark";save();render()},
 book:v=>{sub={b:v};render()},cat:v=>{sub.c=v;render()},item:v=>{sub.i=v;render()},

 addBook:()=>open(shell("إضافة كتاب أو عنوان",["book",`<label for="bt">الاسم</label><input id="bt" required maxlength="80" placeholder="مثال: كتاب الأحياء"><label for="be">الأيقونة</label><select id="be">${EMO.map(e=>`<option>${e}</option>`).join("")}</select><label for="bd">وصف (اختياري)</label><textarea id="bd" style="min-height:80px"></textarea>`])),
 addItem:()=>open(shell("إضافة محتوى",["item",`<label for="it">العنوان</label><input id="it" required maxlength="100" placeholder="مثال: ملخص الفصل الأول"><label for="ix">نص أو ملاحظات (اختياري)</label><textarea id="ix"></textarea><label for="if">صور أو ملفات من جهازك (اختياري)</label><input id="if" type="file" multiple accept="image/*,application/pdf,.pdf,text/*,audio/*,video/*"><label for="ic">📷 تصوير بالكاميرا</label><input id="ic" type="file" accept="image/*" capture="environment">`])),
 delBook:async()=>{const b=book();if(!b||!confirm("حذف هذا العنوان وكل ملفاته؟"))return;for(const i of Object.values(b.items||{}).flat())if(i&&i.fileId)await fdel(i.fileId);S.books=S.books.filter(x=>x.id!==b.id);save();sub={};render()},
 delItem:async v=>{const l=items(book(),sub.c),i=l.find(x=>x.id===v);if(!i||!confirm("حذف هذا العنصر؟"))return;if(i.fileId)await fdel(i.fileId);book().items[sub.c]=l.filter(x=>x.id!==v);save();render()},
 speak:()=>{const i=items(book(),sub.i&&sub.c).find(x=>x.id===sub.i),t=i?(i.text||i.title):"";if(!("speechSynthesis"in window))return toast("القراءة الصوتية غير متاحة");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-EG";speechSynthesis.speak(u)},
 share:async()=>{const i=items(book(),sub.c).find(x=>x.id===sub.i),t=i.text||i.title;try{await navigator.share({title:i.title,text:t})}catch{try{await navigator.clipboard.writeText(t);toast("تم نسخ النص")}catch{toast("المشاركة غير متاحة")}}},
 tick:v=>{const t=S.tasks.find(x=>x.id===v);if(t){t.done=!t.done;if(t.done){burst();if(S.tasks.every(x=>x.done))toast("خلّصت كل مهامك، برافو عليك! 👏")}save();render()}},
 clearDone:()=>{S.tasks=S.tasks.filter(t=>!t.done);save();render()},
 delTask:v=>{S.tasks=S.tasks.filter(x=>x.id!==v);save();render()},
 tgl:()=>{T.run=!T.run;if(T.run)T.end=Date.now()+T.left*1000;tick()},
 rst:()=>{T.run=false;T.left=MODES[T.mode][1];tick()},
 mode:v=>{T={mode:v,left:MODES[v][1],run:false,end:0};render()},
 acc:v=>{S.accent=v;save();render()},th:v=>{S.theme=v;save();render()},
 logout:()=>{S.user=null;save();render()},
 exp:()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.href=u;a.download="mozakeraty-2027-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},
 imp:()=>$("#imf").click(),
 tadj:v=>adj(+v),
 waDev:()=>{window.open("https://wa.me/"+DEVWA+"?text="+encodeURIComponent("أهلاً، أنا "+(S.user?S.user.name:"")+" وبستخدم تطبيق مذاكرتي 2027"),"_blank","noopener")},
mstep:v=>{const e=$("#mv");e.value=Math.min(180,Math.max(1,(+e.value||1)+ +v))},
 editT:()=>open(shell("ضبط الوقت (بالدقائق)",["mins",`<div class="row" style="flex-direction:column;gap:6px;margin-top:10px"><button type="button" class="btn s" data-a="mstep" data-v="1" aria-label="زيادة">▲</button><input id="mv" type="number" min="1" max="180" value="${Math.round(MODES[T.mode][1]/60)}" style="text-align:center;font-size:30px;font-weight:800;max-width:160px"><button type="button" class="btn s" data-a="mstep" data-v="-1" aria-label="نقص">▼</button></div>`])),
 pickPh:()=>$("#phf").click(),rmPh:()=>{S.photo="";save();render()},pickAv:()=>$("#avf").click(),pickCv:()=>$("#cvf").click(),
 rmAv:()=>{S.avatar="";save();render()},rmCv:()=>{S.cover="";save();render()},
 reset:()=>{if(!confirm("سيتم مسح كل بياناتك نهائيًا. متأكد؟"))return;try{localStorage.removeItem(KEY);indexedDB.deleteDatabase("MolakhasPDFStorage")}catch{}dbp=null;S=load();S.user=null;sub={};save();render()}
};
document.addEventListener("click",e=>{if(e.target===dlg()){const r=dlg().getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg().close()}const b=e.target.closest("[data-a]");if(!b||b.type==="checkbox")return;const f=A[b.dataset.a];if(f)f(b.dataset.v)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.a==="tick")A.tick(t.dataset.v);
  else if(t.id==="an"){S.app=t.value.trim()||"مذاكرتي 2027";save();render()}
  else if(t.id==="cc"){S.accent=t.value;save();prefs()}
  else if(t.id==="phf"&&t.files[0]){shrink(t.files[0],256,.85).then(rd).then(u=>{S.photo=u;save();render();toast("تم تغيير صورتك")}).catch(()=>toast("تعذّر قراءة الصورة"));t.value=""}
  else if(t.id&&t.id.startsWith("nf-")){const k=t.id.slice(3);S.notif[k]=k==="at"?t.value:t.checked;if(k==="on"&&t.checked&&window.Notification&&Notification.permission==="default")try{Notification.requestPermission()}catch{}save();render();if(k==="on")chk()}
  else if(t.id==="mir"){S.mirror=t.checked;save();render()}
  else if((t.id==="avf"||t.id==="cvf")&&t.files[0]){const av=t.id==="avf";shrink(t.files[0],av?256:1000,av?.85:.8).then(rd).then(u=>{S[av?"avatar":"cover"]=u;save();render();toast("تم تغيير الصورة")}).catch(()=>toast("تعذّر قراءة الصورة"));t.value=""}
  else if(t.id==="ex"){S.exam=t.value;save();toast("تم الحفظ")}
  else if(t.id==="hr"){S.hrs=Math.min(16,Math.max(1,+t.value||3));save();render()}
  else if(t.id==="gl"){S.goal=Math.min(20,Math.max(1,+t.value||4));save()}
  else if(t.id==="fm"){S.focus=Math.min(120,Math.max(5,+t.value||25));MODES.focus[1]=S.focus*60;if(!T.run&&T.mode==="focus")T.left=MODES.focus[1];save();toast("تم الحفظ")}
  else if(t.id==="imf"&&t.files[0])t.files[0].text().then(x=>{try{const d=JSON.parse(x);if(!Array.isArray(d.books))throw 0;if(!confirm("استبدال بياناتك الحالية بالنسخة المستوردة؟"))return;S={...load(),...d};S.tasks=Array.isArray(S.tasks)?S.tasks:[];S.pomo=S.pomo||{};MODES.focus[1]=(S.focus||25)*60;T={mode:"focus",left:MODES.focus[1],run:false,end:0};save();render();toast("تم الاستيراد")}catch{toast("ملف غير صالح")}})});
document.addEventListener("input",e=>{if(e.target.id==="q"){sub.q=e.target.value;$("#books").innerHTML=grid()}});
document.addEventListener("submit",async e=>{e.preventDefault();const k=e.target.dataset.form,v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
  if(k==="login"){S.user={name:v("ln")};save();render();toast("أهلاً يا "+S.user.name+" 💜");burst()}
  else if(k==="book"){S.books.push({id:uid(),title:v("bt"),desc:v("bd"),emoji:v("be"),items:{}});save();dlg().close();render();toast("تمت الإضافة")}
  else if(k==="mins"){const m=Math.min(180,Math.max(1,Math.round(+v("mv")||1)));adj(m-Math.round(MODES[T.mode][1]/60));dlg().close()}
  else if(k==="exam"){const o={subject:v("xs"),date:v("xd"),time:v("xt"),place:v("xp")};if(exId){const x=S.exams.find(y=>y.id===exId);if(x)Object.assign(x,o)}else S.exams.push({id:uid(),...o});save();dlg().close();render();toast("تم حفظ الامتحان")}
  else if(k==="task"){S.tasks.unshift({id:uid(),text:v("tt"),done:false,due:v("td"),pr:v("tp")});save();render()}
  else if(k==="item"){const fs=[...document.getElementById("if").files,...document.getElementById("ic").files],tt=v("it"),tx=v("ix");if(!fs.length)fs.push(null);for(const [n,f0] of fs.entries()){const en={id:uid(),title:fs.length>1?tt+" "+(n+1):tt,text:tx,createdAt:Date.now()};let f=f0;if(f&&f.type.startsWith("image/")){try{const b=await shrink(f,1800,.82);f=new File([b],f.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"})}catch{}}
    if(f){en.fileId="file_"+en.id;en.fileName=f.name;try{await fput(en.fileId,f)}catch{return toast("تعذّر حفظ الملف على هذا المتصفح")}}
    items(book(),sub.c).push(en)}save();dlg().close();render();toast("تم الحفظ على جهازك")}});
window.addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}sput()});window.addEventListener("hashchange",()=>{sub={};render()});window.addEventListener("bip-ready",()=>{if(S.user&&page()==="settings"&&!document.querySelector("dialog[open]"))render();bipHint()});window.addEventListener("sw-updated",()=>toast("✨ تم تحديث التطبيق، سيظهر الجديد عند فتحه مرة أخرى"));
(async()=>{if(!S.user){const d=await sget();if(d&&d.user){S={...load(),...d};MODES.focus[1]=(S.focus||25)*60;T.left=MODES.focus[1]}}render();chk();bipHint();setInterval(chk,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})})();
})();
